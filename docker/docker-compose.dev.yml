version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: data_project_postgres_dev
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data_network_dev

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: data_project_dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USER: airflow
      DB_PASSWORD: airflow
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: airflow
    volumes:
      - ..:/opt/app
    ports:
      - "8000:8000"
      - "8080:8080"
    working_dir: /opt/app
    stdin_open: true
    tty: true
    networks:
      - data_network_dev

volumes:
  postgres_data_dev:

networks:
  data_network_dev:
    driver: bridge
